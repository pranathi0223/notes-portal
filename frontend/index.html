<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 120px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 5px 5px 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        .cancel-btn {
            background: #6c757d;
        }

        .note {
            background: white;
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        .note h3 {
            margin-top: 0;
        }

        #editSection {
            display: none;
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Notes Portal</h1>
	<button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <p>Simple AWS Serverless Notes App</p>
</header>

<div class="container">

    <h2>Add a Note</h2>

    <input type="text" id="title" placeholder="Enter note title">

    <textarea id="content" placeholder="Enter note content"></textarea>

    <button onclick="addNote()">Add Note</button>

    <div id="editSection">

        <h2>Edit Note</h2>

        <input type="hidden" id="editId">

        <input type="text" id="editTitle" placeholder="Enter new title">

        <textarea id="editContent" placeholder="Enter new content"></textarea>

        <button onclick="updateNote()">Update Note</button>

        <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>

    </div>

   <h2>My Notes (<span id="noteCount">0</span>)</h2>

<input
    type="text"
    id="searchBox"
    placeholder="🔍 Search notes..."
    oninput="searchNotes()"
>

<button onclick="loadNotes()">Refresh Notes</button>

    <div id="notes"></div>

</div>

<script>

const API_URL = "http://127.0.0.1:3000/notes";


async function addNote() {

    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;

    if (title === "" || content === "") {
        alert("Please enter title and content");
        return;
    }

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                content: content
            })
        });

        await response.json();

        alert("Note added successfully!");

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";

        loadNotes();

    } catch (error) {

        console.error(error);
        alert("Unable to connect to backend");

    }
}


async function loadNotes() {

    try {

        const response = await fetch(API_URL);
        const notes = await response.json();

        const notesDiv = document.getElementById("notes");

        notesDiv.innerHTML = "";
	document.getElementById("noteCount").textContent = notes.length;

        notes.forEach(note => {

            const div = document.createElement("div");

            div.className = "note";

            div.innerHTML = `
                <h3>${note.title}</h3>
                <p>${note.content}</p>

                <button onclick="editNote('${note.id}', '${escapeText(note.title)}', '${escapeText(note.content)}')">
                    Edit
                </button>

                <button class="delete-btn" onclick="deleteNote('${note.id}')">
                    Delete
                </button>
            `;

            notesDiv.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("notes").innerHTML =
            "<p>Unable to load notes. Start the backend first.</p>";

    }
}


function escapeText(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, "\\n");

}


function editNote(id, title, content) {

    document.getElementById("editSection").style.display = "block";

    document.getElementById("editId").value = id;

    document.getElementById("editTitle").value = title;

    document.getElementById("editContent").value = content;

    window.scrollTo(0, 0);

}


async function updateNote() {

    const id = document.getElementById("editId").value;

    const title = document.getElementById("editTitle").value;

    const content = document.getElementById("editContent").value;

    if (title === "" || content === "") {

        alert("Please enter title and content");

        return;

    }

    try {

        const response = await fetch(`${API_URL}/${id}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                title: title,
                content: content
            })

        });

        await response.json();

        alert("Note updated successfully!");

        cancelEdit();

        loadNotes();

    } catch (error) {

        console.error(error);

        alert("Unable to update note");

    }

}


async function deleteNote(id) {

    const confirmDelete = confirm("Are you sure you want to delete this note?");

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        });

        await response.json();

        alert("Note deleted successfully!");

        loadNotes();

    } catch (error) {

        console.error(error);

        alert("Unable to delete note");

    }

}


function cancelEdit() {

    document.getElementById("editSection").style.display = "none";

    document.getElementById("editId").value = "";

    document.getElementById("editTitle").value = "";

    document.getElementById("editContent").value = "";

}


loadNotes();
function searchNotes() {

    const searchText = document
        .getElementById("searchBox")
        .value
        .toLowerCase();

    const notes = document.querySelectorAll(".note");

    notes.forEach(note => {

        const text = note.innerText.toLowerCase();

        if (text.includes(searchText)) {
            note.style.display = "block";
        } else {
            note.style.display = "none";
        }

    });
}

</script>

</body>
</html>
